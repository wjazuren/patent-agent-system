services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: patent-agent-postgres
    environment:
      POSTGRES_DB: patent_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - patent_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patent_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patent_agent_postgres_data:
